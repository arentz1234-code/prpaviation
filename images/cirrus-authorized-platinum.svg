<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0984e3"/>
      <stop offset="100%" style="stop-color:#74b9ff"/>
    </linearGradient>
  </defs>

  <!-- Main badge background -->
  <rect x="2" y="2" width="276" height="86" rx="12" ry="12" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="276" height="86" rx="12" ry="12" fill="none" stroke="#4a5568" stroke-width="1"/>

  <!-- Cirrus logo circle -->
  <circle cx="50" cy="45" r="28" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- SR-22 Clean Silhouette -->
  <g transform="translate(50, 47) scale(0.55) rotate(-8)">
    <!-- Single path silhouette of SR-22 facing right -->
    <path d="
      M -40,0
      L -38,-2
      C -36,-4 -32,-6 -28,-6
      L -20,-6
      L -18,-14
      L -14,-14
      L -14,-6
      L 10,-6
      C 14,-6 18,-5 22,-3
      L 26,-2
      C 30,-1 34,0 38,0
      L 42,0
      L 42,2
      L 38,2
      C 34,3 30,4 26,5
      L 20,6
      C 16,7 12,8 8,8
      L -10,8
      L -10,12
      C -10,14 -12,16 -14,16
      C -16,16 -18,14 -18,12
      L -18,8
      L -28,8
      L -28,14
      C -28,16 -30,18 -32,18
      C -34,18 -36,16 -36,14
      L -36,8
      C -38,7 -40,5 -40,3
      L -40,0
      Z
      M 6,8 L 6,10 L 28,14 L 30,12 L 8,8 Z
      M -14,8 L -14,10 L -36,14 L -38,12 L -16,8 Z
    " fill="#ffffff" fill-rule="evenodd"/>

    <!-- Propeller -->
    <ellipse cx="44" cy="1" rx="1.5" ry="10" fill="#ffffff"/>

    <!-- GPS antenna -->
    <rect x="0" y="-10" width="2" height="5" fill="#ffffff"/>
  </g>

  <!-- CIRRUS text -->
  <text x="95" y="36" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="2">CIRRUS</text>

  <!-- AUTHORIZED text -->
  <text x="95" y="52" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="#ffffff" letter-spacing="1.5">AUTHORIZED</text>

  <!-- PLATINUM pill badge -->
  <rect x="95" y="60" width="85" height="18" rx="9" ry="9" fill="url(#blueGrad)"/>
  <text x="137.5" y="73" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">PLATINUM</text>

  <!-- Service Center text -->
  <text x="190" y="73" font-family="Arial, sans-serif" font-size="9" fill="rgba(255,255,255,0.6)" letter-spacing="0.5">SERVICE CENTER</text>
</svg>
